[Query]
all_stored_locally = SELECT
        id id_local
    FROM
        retenciones_ats.retencion_ats
    WHERE
        fecha_emision >= ?
        order by fecha_emision ASC
not_controlled = SELECT
        id id_local,
        numero_comprobante numero,
        fecha_emision
    FROM
        retenciones_ats.retencion_ats
    WHERE
        id in (:sequence) AND
        fecha_emision >= ?
not_controlled_first_time = SELECT TOP :limit
        id id_local,
        numero_comprobante numero,
        fecha_emision
    FROM
        retenciones_ats.retencion_ats
    WHERE
        fecha_emision >= ?
headers = SELECT
        id id_local,
        secuencial,
        fecha_emision,
        clave_acceso,
        tipo_emision,
        periodo_fiscal
    FROM
        retenciones_ats.retencion_ats
    WHERE
        id in (:sequence)
    ORDER BY id :order
ats_retention_seller = SELECT
        ruc,
        obligado_contabilidad,
        contribuyente_especial,
        nombre_comercial,
        razon_social,
        direccion_establecimiento,
        direccion_matriz direccion_emisor,
        codigo_establecimiento codigo,
        punto_emision   
    FROM
      retenciones_ats.retencion_ats
    WHERE
      id = ?
supporting_documents = SELECT
        id,
        codigo_sustento,
        tipo_documento,
        numero,
        fecha_emision,
        fecha_registro_contable,
        numero_autorizacion,
        tipo_pago,
        total_sin_impuestos,
        total,
        tipo_regimen_fiscal,
        pais,
        aplica_convenio,
        pago_exterior,
        pago_regimen_fiscal
    FROM
        retenciones_ats.documentos_soporte
    WHERE
        id_retencion_ats = ?
ats_retention_recipient = SELECT
        email_sujeto email,
        identificacion_sujeto identificacion,
        tipo_identificacion_sujeto tipo_identificacion,
        razon_social_sujeto razon_social,
        direccion_sujeto direccion,
        telefono_sujeto telefono,
        tipo_sujeto_retenido
    FROM
        retenciones_ats.retencion_ats
    WHERE
    id = ?
supporting_document_taxes = SELECT
        codigo,
        codigo_porcentaje,
        base_imponible,
        valor,
        tarifa
    FROM
        retenciones_ats.impuestos_documentos_soporte
    WHERE
        id_documento_soporte = ?
supporting_document_reimbursment = SELECT
        id,
        codigo,
        subtotal,
        total_reembolso total,
        total_impuestos
    FROM
        retenciones_ats.documentos_soporte
    WHERE
        id = ?
reimbursement_documents = SELECT
        id id_documento_reembolso,
        codigo_establecimiento,
        codigo_punto_emision,
        fecha_emision,
        identificacion_proveedor,
        numero_autorizacion,
        pais_origen_proveedor,
        secuencia,
        tipo,
        tipo_identificacion_proveedor,
        tipo_proveedor
    FROM
        retenciones_ats.documentos_reembolso
    WHERE
        id_documento_soporte = ?
reimbursement_document_tax = SELECT
        codigo,
        codigo_porcentaje,
        tarifa,
        base_imponible,
        valor
    FROM
        retenciones_ats.impuestos_reembolsos
    WHERE
        id_documento_reembolso = ?
supporting_documents_retentions = SELECT
        id,
        codigo,
        codigo_porcentaje,
        base_imponible,
        tarifa,
        valor_retenido
    FROM
        retenciones_ats.retenciones_documentos_soporte
    WHERE
        id_documento_soporte = ?
supporting_documents_dividends = SELECT
        fecha_pago,
        impuesto_renta,
        annio_fiscal
    FROM
        retenciones_ats.dividendos_retenciones
    WHERE
        id_documento_soporte = ?
supporting_documents_payments = SELECT
        tipo_pago,
        total
    FROM
        retenciones_ats.pagos_documentos_soporte
    WHERE
        id_documento_soporte = ?
ats_retention_additional_information = SELECT
        nombre _nombre_,
        valor _valor_
    FROM
        retenciones_ats.info_adicional
    WHERE
        id_retencion_ats = ?
ats_retention_update_customer_table = UPDATE
    retenciones_ats.retencion_ats
  SET
    estado =  ?,
    numero_autorizacion = ?,
    fecha_autorizacion = ?,
    id_externo = ?
  WHERE
    id = ?