[Query]
all_stored_locally = SELECT
    id_retencion id_local
    FROM 
    retenciones.cabecera
    WHERE
    fecha_emision >= ?
    order by fecha_emision ASC
not_controlled = SELECT
    id_retencion id_local,
    numero_comprobante numero,
    fecha_emision
    FROM
    retenciones.cabecera
    WHERE 
    id_retencion in (:sequence) AND
    fecha_emision >= ?
not_controlled_first_time = SELECT TOP :limit
    id_retencion id_local,
    numero_comprobante numero,
    fecha_emision
    FROM
    retenciones.cabecera
    WHERE
    fecha_emision >= ?
headers = SELECT
    id_retencion             id_local,
    secuencial,
    fecha_emision,
    clave_acceso,
    tipo_emision,
    periodo_fiscal
    FROM
    retenciones.cabecera
    WHERE
    id_retencion in (:sequence)
    ORDER BY id_retencion :order
retention_seller  = SELECT
    ruc,
    obligado_contabilidad,
    contribuyente_especial,
    nombre_comercial,
    razon_social,
    direccion_establecimiento,
    direccion_emisor,
    codigo,
    punto_emision
    FROM
    retenciones.cabecera
    WHERE
    id_retencion = ?
retention_recipient  = SELECT
    identificacion,
    tipo_identificacion,
    razon_social,
    direccion,
    email,
    telefono
    FROM
    retenciones.cabecera
    WHERE
    id_retencion = ?
retention_taxes  = SELECT
    codigo,
    codigo_porcentaje,
    porcentaje,
    base_imponible,
    valor_retenido,
    tipo_documento_sustento,
    numero_documento_sustento,
    fecha_emision_documento_sustento
    FROM 
    retenciones.impuestos
    WHERE
    id_retencion = ?
retention_additional_information = SELECT
    columna_de_nombres    _nombre_,
    columna_de_valores    _valor_
    FROM
    retenciones.informacion_adicional
    WHERE
    id_retencion = ?
retention_update_customer_table = UPDATE
    retenciones.cabecera
    SET 
    estado =  ?,
    numero_autorizacion = ?,
    fecha_autorizacion = ?,
    id_externo = ?
    WHERE
    id_retencion = ?
update_state_in_customer_table = UPDATE
    retenciones.cabecera
    SET 
    estado =  ?
    WHERE
    id_retencion = ?
update_access_key_in_customer_table = UPDATE
    retenciones.cabecera
    SET 
    clave_acceso = ?
    WHERE
    id_retencion = ?
save_message_in_customer_table = INSERT INTO
    mensaje(
    id_retencion, 
    identificador, 
    mensaje,
    tipo)
    VALUES(?,?,?,?)
delete_message_in_customer_table = DELETE FROM
    retenciones.mensaje
    WHERE
    id_retencion = ?
    AND identificador = ?