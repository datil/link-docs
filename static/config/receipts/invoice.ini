[Query]
all_stored_locally = SELECT
      id id_local
    FROM
      facturas.factura
    WHERE
      fecha_emision >= ?
    ORDER BY
      fecha_emision ASC
not_controlled = SELECT
      id id_local,
      (codigo_establecimiento + '-' + punto_emision + '-' + convert(varchar, secuencial)) numero,
      fecha_emision
    FROM
      facturas.factura
    WHERE
      id in (:sequence) AND
      fecha_emision >= ?
not_controlled_first_time = SELECT TOP :limit
      id id_local,
      (codigo_establecimiento + '-' + punto_emision + '-' + convert(varchar, secuencial)) numero,
      fecha_emision
    FROM
      facturas.factura
    WHERE
      fecha_emision >= ?
headers = SELECT
      id id_local,
      secuencial,
      fecha_emision,
      guia_remision,
      moneda,
      clave_acceso,
      tipo_emision,
      valor_retenido_iva,
      valor_retenido_renta
    FROM
      facturas.factura
    WHERE
      id in (:sequence)
    ORDER BY id :order
invoice_seller  = SELECT
      ruc,
      obligado_contabilidad,
      contribuyente_especial,
      nombre_comercial,
      razon_social,
      direccion_establecimiento,
      direccion_matriz direccion_emisor,
      codigo_establecimiento codigo,
      punto_emision
    FROM
      facturas.factura
    WHERE
      id = ?
invoice_buyer  = SELECT
      identificacion_comprador identificacion,
      tipo_identificacion_comprador tipo_identificacion,
      razon_social_comprador razon_social,
      direccion_comprador direccion,
      email_comprador email,
      telefono_comprador telefono
    FROM
      facturas.factura
    WHERE
      id = ?
invoice_totals  = SELECT
    total_sin_impuestos,
    importe_total,
    propina,
    descuento
    FROM
    facturas.factura
    WHERE
    id = ?
invoice_totals_taxes  = SELECT
    codigo,
    codigo_porcentaje,
    base_imponible,
    valor
    FROM
    facturas.total_impuesto
    WHERE
    id_factura = ?
items  = SELECT
    id id_detalle,
    codigo_principal,
    codigo_auxiliar,
    descripcion,
    cantidad,
    unidad_medida,
    precio_unitario,
    descuento,
    precio_total_sin_impuestos
    FROM
    facturas.item
    WHERE
    id_factura = ?
item_taxes  = SELECT
    id_item id_detalle,
    base_imponible,
    valor,
    tarifa,
    codigo,
    codigo_porcentaje
    FROM
    facturas.item_impuesto
    WHERE
    id_item = ?
item_details = SELECT
    nombre    nombre,
    valor   valor
    FROM
    facturas.item_detalle_adicional
    WHERE
    id_item = ?
invoice_additional_information = SELECT
    nombre    _nombre_,
    valor     _valor_
    FROM
    facturas.informacion_adicional
    WHERE
    id_factura = ?
payment_methods = SELECT
      id id_pago,
      medio,
      monto total
    FROM
      facturas.pago
    WHERE
      id_factura = ?
payment_method_properties = None
invoice_credit = SELECT
    fecha_vencimiento,
    monto
    FROM
    facturas.credito
    WHERE
    id_factura = ?
invoice_compensation = SELECT
    codigo,
    tarifa,
    valor
    FROM
    facturas.compensacion
    WHERE
    id = ?
invoice_export = SELECT
    incoterm_termino,
    incoterm_lugar,
    incoterm_total_sin_impuestos,
    codigo_pais_origen,
    codigo_pais_destino,
    codigo_pais_adquisicion,
    puerto_origen,
    puerto_destino,
    total_flete_internacional,
    total_seguro_internacional,
    total_gastos_aduaneros,
    total_otros_gastos_transporte
    FROM
    facturas.exportacion
    WHERE
    id = ?
invoice_reimbursement = SELECT
        id_reembolso,
        codigo,
        subtotal,
        total,
        total_impuestos
    FROM
      facturas.reembolso
    WHERE
      id_factura = ?
invoice_reimbursement_document = SELECT
        id_documento,
        identificacion_proveedor,
        tipo_identificacion_proveedor,
        pais_origen_proveedor,
        tipo_proveedor,
        codigo_establecimiento,
        secuencia,
        codigo_punto_emision,
        fecha_emision,
        numero_autorizacion,
        tipo
    FROM
      facturas.reembolso_documento
    WHERE
      id_reembolso = ?
invoice_reimbursement_document_tax = SELECT
        codigo,
        codigo_porcentaje,
        tarifa,
        base_imponible,
        valor
    FROM
        facturas.reembolso_documento_impuesto
    WHERE
        id_documento = ?
on_status_update = {% if estado == 'AUTORIZADO' %}
    UPDATE facturas.factura
    SET estado = 'A'
    WHERE id = {{ id_local }}
  {% endif %}
invoice_update_customer_table = UPDATE
    facturas.cabecera
  SET
    estado =  ?,
    numeroAutorizacion = ?,
    fechaAutorizacion = ?,
    id_externo = ?
  WHERE
    id_factura = ?
update_state_in_customer_table = UPDATE
    facturas.cabecera
    SET
    estado =  ?
    WHERE
    id_factura = ?
update_access_key_in_customer_table = UPDATE
    facturas.cabecera
    SET
    clave_acceso = ?
    WHERE
    id_factura = ?
save_message_in_customer_table = None
delete_message_in_customer_table = None
