[Query]
all_stored_locally = SELECT
      id id_local
    FROM
      liquidaciones_compra.liquidacion
    WHERE
      fecha_emision >= ?
    ORDER BY
      fecha_emision ASC
not_controlled = SELECT
      id id_local,
      (codigo_establecimiento + '-' + punto_emision + '-' + convert(varchar, secuencial)) numero,
      fecha_emision
    FROM
      liquidaciones_compra.liquidacion
    WHERE
      id in (:sequence) AND
      fecha_emision >= ?
not_controlled_first_time = SELECT TOP :limit
      id id_local,
      (codigo_establecimiento + '-' + punto_emision + '-' + convert(varchar, secuencial)) numero,
      fecha_emision
    FROM
      liquidaciones_compra.liquidacion
    WHERE
      fecha_emision >= ?
headers = SELECT
      id id_local,
      secuencial,
      fecha_emision,
      moneda,
      tipo_emision
    FROM
      liquidaciones_compra.liquidacion
    WHERE
      id in (:sequence)
    ORDER BY id :order
purchase_settlement_buyer  = SELECT
      ruc,
      obligado_contabilidad,
      contribuyente_especial,
      nombre_comercial,
      razon_social,
      direccion_establecimiento,
      direccion_matriz direccion_emisor,
      codigo_establecimiento codigo,
      punto_emision
    FROM
      liquidaciones_compra.liquidacion
    WHERE
      id = ?
purchase_settlement_provider = SELECT
      identificador_proveedor identificacion,
      tipo_identificador_proveedor tipo_identificacion,
      razon_social_proveedor razon_social,
      direccion_proveedor direccion
    FROM
      liquidaciones_compra.liquidacion
    WHERE
      id = ?
purchase_settlement_totals  = SELECT
      total_sin_impuestos,
      importe_total,
      descuento
    FROM
      liquidaciones_compra.liquidacion
    WHERE
      id = ?
purchase_settlement_totals_taxes = SELECT
      codigo,
      codigo_porcentaje,
      base_imponible,
      valor
    FROM 
      liquidaciones_compra.total_impuesto
    WHERE
      id_liquidacion = ?
items  = SELECT
      id id_detalle,
      codigo_principal,
      codigo_auxiliar,
      descripcion,
      cantidad,
      unidad_medida,
      precio_unitario,
      descuento,
      precio_total_sin_impuestos
    FROM
      liquidaciones_compra.item
    WHERE
      id_liquidacion = ?
item_taxes  = SELECT
      id_item id_detalle,
      base_imponible,
      valor,
      tarifa,
      codigo,
      codigo_porcentaje
    FROM
      liquidaciones_compra.item_impuesto
    WHERE
      id_item = ?
item_details = SELECT
      nombre    nombre,
      valor   valor
    FROM
      liquidaciones_compra.item_detalle_adicional
    WHERE
      id_item = ?
purchase_settlement_additional_information = SELECT
      nombre    _nombre_,
      valor     _valor_
    FROM
      liquidaciones_compra.info_adicional
    WHERE
      id_liquidacion = ?
purchase_settlement_reimbursement = SELECT
        r.id_reembolso,
        l.codigo_documento_reembolso
      FROM
        liquidaciones_compra.liquidacion AS l JOIN
        liquidaciones_compra.reembolso AS r 
      ON
        l.id = r.id_liquidacion
      WHERE
        id = ?
purchase_settlement_reimbursement_totals = SELECT
        total_comprobante_reembolso subtotal,
        total_base_imponible_reembolso total,
        total_impuesto_reembolso total_impuestos
    FROM
        liquidaciones_compra.liquidacion
    WHERE
        id = ?
purchase_settlement_reimbursement_document = SELECT
        codigo_documento_reembolso codigo,
        id_reembolso id_documento,
        id_proveedor_reembolso,
        tipo_id_proveedor_reembolso,
        codigo_pais_pago_proveedor_reembolso,
        tipo_proveedor_reembolso,
        secuencia_reembolso,
        punto_emision_reembolso,
        fecha_emision_reembolso,
        numero_autorizacion_reembolso,
        codigo_establecimiento_reembolso
    FROM
      liquidaciones_compra.reembolso
    WHERE
      id_reembolso = ?
purchase_settlement_reimbursement_tax = SELECT
        codigo,
        codigo_porcentaje,
        tarifa,
        base_imponible,
        impuesto_reembolso
    FROM
        liquidaciones_compra.reembolso_tax
    WHERE
        id_reembolso = ?
purchase_settlement_fiscal_machine = SELECT
        [marca],
        [modelo],
        [serie]
    FROM
        liquidaciones_compra.maquina_fiscal
    WHERE
        id_liquidacion = ?
payment_methods = SELECT
      forma_pago,
      total total,
      unidad_tiempo,
      plazo
    FROM
      liquidaciones_compra.pago
    WHERE
      id_liquidacion = ?
on_status_update = {% if estado == 'AUTORIZADO' %}
    UPDATE   liquidaciones_compra.liquidacion
    SET estado = 'A'
    WHERE id = {{ id_local }}
  {% endif %}
update_access_key_in_customer_table = UPDATE
    liquidaciones_compra.liquidacion
    SET
      clave_acceso = ?
    WHERE
      id = ?
purchase_settlement_update_customer_table = UPDATE
    liquidaciones_compra.cabecera
  SET
    estado =  ?,
    numero_autorizacion = ?,
    fecha_autorizacion = ?,
    id_externo = ?
  WHERE
    id_liquidacion = ?
update_state_in_customer_table = None
save_message_in_customer_table = None
delete_message_in_customer_table = None
