[Query]
all_stored_locally = SELECT
    id_guia_remision id_local
    FROM 
    notas_de_debito.cabecera
    WHERE
    fecha_emision >= ?
    order by fecha_emision ASC
not_controlled = SELECT
    id_guia_remision id_local,
    numero_comprobante numero,
    fecha_emision
    FROM
    notas_de_debito.cabecera
    WHERE 
    id_guia_remision in (:sequence) AND
    fecha_emision >= ?
not_controlled_first_time = SELECT TOP :limit
    id_guia_remision id_local,
    numero_comprobante numero,
    fecha_emision
    FROM
    notas_de_debito.cabecera
    WHERE
    fecha_emision >= ?
headers = SELECT TOP :limit 
    id         id_local,
    secuencial,
    fecha_emision,
    moneda,
    clave_acceso,
    tipo_emision,
    fecha_emision_documento_modificado,
    numero_documento_modificado,
    tipo_documento_modificado
    FROM
    notas_de_debito.cabecera
    WHERE
    id in (:sequence)
    ORDER BY id :order
debit_note_seller = SELECT
    ruc,
    obligado_contabilidad,
    contribuyente_especial,
    nombre_comercial,
    razon_social,
    direccion_establecimiento,
    direccion_emisor,
    codigo,
    punto_emision
    FROM
    notas_de_debito.cabecera
    WHERE
    id = ?
debit_note_buyer = SELECT
    identificacion_comprador        identificacion,
    tipo_identificacion_comprador               tipo_identificacion,
    razon_social_comprador          razon_social,
    direccion_comprador         direccion,   
    email_comprador                 email,
    telefono_comprador          telefono
    FROM
    notas_de_debito.cabecera
    WHERE
    id = ?
debit_note_totals = SELECT
    total_sin_impuestos,
    importe_total
    FROM
    notas_de_debito.totales
    WHERE
    id = ?
debit_note_totals_taxes =  SELECT
    codigo,
    codigo_porcentaje,
    base_imponible,
    valor,
    tarifa
    FROM
    notas_de_debito.totales_impuestos
    WHERE
    id_nota_debito = ?
debit_note_causes = SELECT
    motivo,
    valor
    FROM
    notas_de_debito.items 
    WHERE
    id_nota_debito = ?
debit_note_additional_information = SELECT
    nombre    _nombre_,
    valor     _valor_
    FROM
    notas_de_debito.informacion_adicional
    WHERE
    id_nota_debito = ?
debit_note_update_customer_table = UPDATE
    notas_de_credito.cabecera
    SET 
    estado =  ?,
    numero_autorizacion = ?,
    fecha_autorizacion = ?,
    id_externo = ?
    WHERE
    id_nota_debito = ?
update_state_in_customer_table = UPDATE
    notas_de_credito.cabecera
    SET 
    estado =  ?
    WHERE
    id_nota_debito = ?
update_access_key_in_customer_table = UPDATE
    notas_de_credito.cabecera
    SET 
    clave_acceso = ?
    WHERE
    id_nota_debito = ?
save_message_in_customer_table = INSERT INTO
    mensaje(
    id_nota_debito, 
    identificador, 
    mensaje,
    tipo)
    VALUES(?,?,?,?)
delete_message_in_customer_table = DELETE FROM
    notas_de_credito.mensaje
    WHERE
    id_nota_debito = ?
    AND identificador = ?