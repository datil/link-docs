[Query]
all_stored_locally = SELECT
    id_guia_remision id_local
    FROM 
    guias_de_remision.cabecera
    WHERE
    fecha_emision >= ?
    order by fecha_emision ASC
not_controlled = SELECT
    id_guia_remision id_local,
    numero_comprobante numero,
    fecha_emision
    FROM
    guias_de_remision.cabecera
    WHERE 
    id_guia_remision in (:sequence) AND
    fecha_emision >= ?
not_controlled_first_time = SELECT TOP :limit
    id_guia_remision id_local,
    numero_comprobante numero,
    fecha_emision
    FROM
    guias_de_remision.cabecera
    WHERE
    fecha_emision >= ?
headers = SELECT
    id_guia_remision             id_local,
    secuencial,
    fecha_inicio_transporte,
    fecha_fin_transporte,
    direccion_partida,
    clave_acceso,
    tipo_emision
    FROM
    guias_de_remision.cabecera
    WHERE
    id_guia_remision in (:sequence)
    ORDER BY id_guia_remision :order
waybill_seller  = SELECT
    ruc,
    obligado_contabilidad,
    contribuyente_especial,
    nombre_comercial,
    razon_social,
    direccion_establecimiento,
    direccion_emisor,
    codigo,
    punto_emision
    FROM
    guias_de_remision.cabecera
    WHERE
    id_guia_remision = ?
waybill_shipper  = SELECT
    identificacion,
    tipo_identificacion,
    razon_social,
    placa,
    direccion,
    email,
    telefono
    FROM
    guias_de_remision.cabecera
    WHERE
    id_guia_remision = ?
waybill_receivers  = SELECT
    id_destinatario     receiver_id,
    razon_social,
    identificacion,
    tipo_identificacion,
    email,
    telefono,
    direccion,
    ruta,
    documento_aduanero_unico,
    codigo_establecimiento_destino,
    fecha_emision_documento_sustento,
    numero_documento_sustento,
    tipo_documento_sustento,
    motivo_traslado,
    numero_autorizacion_documento_sustento
    FROM
    guias_de_remision.destinatario
    WHERE
    id_guia_remision = ?
waybill_receiver_items = SELECT
    id_detalle,
    descripcion,
    codigo_principal,
    codigo_auxiliar,
    cantidad
    FROM
    guias_de_remision.detalle
    WHERE
    id_destinatario = ?
item_details = SELECT
    columna_de_nombres    nombre,
    columna_de_valores   valor
    FROM
    guias_de_remision.items_detalles_adicionales
    WHERE
    id_detalle = ?
waybill_additional_information = SELECT
    columna_de_nombres    _nombre_,
    columna_de_valores     _valor_
    FROM
    guias_de_remision.informacion_adicional
    WHERE
    id_guia_remision = ?
waybill_update_customer_table = UPDATE
    guias_de_remision.cabecera
    SET 
    estado =  ?,
    numero_autorizacion = ?,
    fecha_autorizacion = ?,
    id_externo = ?
    WHERE
    id_guia_remision = ?
update_state_in_customer_table = UPDATE
    guias_de_remision.cabecera
    SET 
    estado =  ?
    WHERE
    id_guia_remision = ?
update_access_key_in_customer_table = UPDATE
    guias_de_remision.cabecera
    SET 
    clave_acceso = ?
    WHERE
    id_guia_remision = ?
save_message_in_customer_table = INSERT INTO
    mensaje(
    id_guia_remision, 
    identificador, 
    mensaje,
    tipo)
    VALUES(?,?,?,?)
delete_message_in_customer_table = DELETE FROM
    guias_de_remision.mensaje
    WHERE
    id_guia_remision = ?
    AND identificador = ?