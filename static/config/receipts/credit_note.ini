[Query]
all_stored_locally = SELECT
    id_nota_credito id_local
    FROM
    notas_de_credito.cabecera
    WHERE
    fecha_emision >= ?
    order by fecha_emision ASC
not_controlled = SELECT
    id_nota_credito id_local,
    numero_comprobante numero,
    fecha_emision
    FROM
    notas_de_credito.cabecera
    WHERE
    id_nota_credito in (:sequence) AND
    fecha_emision >= ?
not_controlled_first_time = SELECT TOP :limit
    id_nota_credito id_local,
    numero_comprobante numero,
    fecha_emision
    FROM
    notas_de_credito.cabecera
    WHERE
    fecha_emision >= ?
headers = SELECT
    id_nota_credito            id_local,
    secuencial,
    fecha_emision,
    guia_remision,
    moneda,
    clave_acceso,
    tipo_emision,
    fecha_emision_documento_modificado,
    numero_documento_modificado,
    tipo_documento_modificado,
    motivo
    FROM
    notas_de_credito.cabecera
    WHERE
    id_nota_credito in (:sequence)
    ORDER BY id_nota_credito :order
credit_note_seller  = SELECT
    ruc,
    obligado_contabilidad,
    contribuyente_especial,
    nombre_comercial,
    razon_social,
    direccion_establecimiento,
    direccion_emisor,
    codigo,
    punto_emision
    FROM
    notas_de_credito.cabecera
    WHERE
    id_nota_credito = ?
credit_note_buyer  = SELECT
    identificacion,
    tipo_identificacion,
    razon_social,
    direccion,
    email,
    telefono
    FROM
    notas_de_credito.cabecera
    WHERE
    id_nota_credito = ?
credit_note_totals  = SELECT
    total_sin_impuestos,
    importe_total
    FROM
    notas_de_credito.cabecera
    WHERE
    id_nota_credito = ?
credit_note_totals_taxes  = SELECT
    codigo,
    codigo_porcentaje,
    base_imponible,
    valor
    FROM
    notas_de_credito.totales_impuestos
    WHERE
    id_nota_credito = ?
items  = SELECT
    id_detalle,
    codigo_principal,
    codigo_auxiliar,
    descripcion,
    cantidad,
    precio_unitario,
    descuento,
    precio_total_sin_impuestos
    FROM
    notas_de_credito.items
    WHERE
    id_nota_credito = ?
item_taxes  = SELECT
    base_imponible,
    valor,
    tarifa,
    codigo,
    codigo_porcentaje
    FROM
    notas_de_credito.items_impuestos
    WHERE
    id_detalle = ?
item_details = SELECT
    nombre    nombre,
    valor     valor
    FROM
    notas_de_credito.items_detalles_adicionales
    WHERE
    id_detalle = ?
credit_note_additional_information = SELECT
    columna_de_nombres    _nombre_,
    columna_de_valores    _valor_
    FROM
    notas_de_credito.informacion_adicional
    WHERE
    id_detalle = ?
credit_note_update_customer_table = UPDATE
    notas_de_credito.cabecera
    SET
    estado =  ?,
    numero_autorizacion = ?,
    fecha_autorizacion = ?,
    id_externo = ?
    WHERE
    id_nota_credito = ?
update_state_in_customer_table = UPDATE
    notas_de_credito.cabecera
    SET
    estado =  ?
    WHERE
    id_nota_credito = ?
update_access_key_in_customer_table = UPDATE
    notas_de_credito.cabecera
    SET
    clave_acceso = ?
    WHERE
    id_nota_credito = ?
save_message_in_customer_table = INSERT INTO
    mensaje(
    id_nota_credito,
    identificador,
    mensaje,
    tipo)
    VALUES(?,?,?,?)
delete_message_in_customer_table = DELETE FROM
    notas_de_credito.mensaje
    WHERE
    id_nota_credito = ?
    AND identificador = ?
credit_note_compensation = None