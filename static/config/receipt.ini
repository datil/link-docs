[Query]
receipt_update_state = UPDATE
    dbo.Control
	SET
    estado = ?
	WHERE
    id_control = ?
receipt_get_state = SELECT
    estado estado
	FROM
	  dbo.Control
	WHERE
    id_control = ?
receipt_get_messages = SELECT *
	FROM
    dbo.Mensaje
	WHERE
	  id_control = ?
receipt_delete_messages = DELETE FROM
	  dbo.Mensaje
	WHERE
	  id_control = ?
receipt_save_messages = INSERT INTO
    dbo.Mensaje
    (id_control, identificador, mensaje, tipo, fecha_creacion)
	VALUES
    (?, ?, ?, ?, ?)
receipt_set_external_id = UPDATE
    dbo.Control
	SET
    id_externo = ?
	WHERE
    id_control = ?
receipt_set_access_key = UPDATE
    dbo.Control
	SET
    clave_acceso = ?
	WHERE
    id_control = ?
receipt_get_external_id = SELECT
    id_externo id_externo
	FROM
    dbo.Control
	WHERE
    id_control = ?
receipt_save_authorization_info = UPDATE
    dbo.Control
	SET
    numero_autorizacion = ?,
	  fecha_autorizacion = ?
	WHERE
    id_control = ? AND
	  tipo_comprobante = ?
receipt_get_authorization_info = SELECT
    fecha_autorizacion,
    numero_autorizacion
	FROM
    dbo.Control
	WHERE
    id_control = ? AND
	  tipo_comprobante = ?
receipt_update_last_issue_date = UPDATE
    dbo.Control
	SET
    fecha_ultimo_envio = ?
	WHERE
    id_control = ? AND
	  tipo_comprobante = ?
receipts_by_state = SELECT TOP :limit
    id_control, id_local
	FROM
    Control
	WHERE
    estado = ? AND
	  tipo_comprobante = ? AND
    company_name = ?
	ORDER BY
    id_control :order
receipts_controlled = SELECT
    id_local
	FROM
    dbo.Control control
	WHERE
    control.tipo_comprobante = ? AND
    control.fecha_emision >= ? AND
    control.company_name = ?
receipt_update_control_table = INSERT INTO
  Control(
    tipo_comprobante,
	  id_local,
	  numero_comprobante,
	  estado,
	  fecha_emision,
	  fecha_ingreso,
	  company_name
  )
	:new_rows
receipt_insert_to_control_values_pattern = (%s, '%s', '%s', '%s', '%s', '%s', '%s')
receipt_quantity_by_state = SELECT
	estado  estado,
	count(estado) cantidad
	FROM
	dbo.Control
	WHERE tipo_comprobante = ?
	GROUP BY
	estado
receipt_with_errors = SELECT top 10
	control.id_control id_control,
	control.estado estado,
	control.tipo_comprobante tipo,
	control.numero_comprobante secuencial,
	control.id_externo id_externo,
	m.fecha_creacion fecha,
	m.mensaje mensaje
	FROM
	Control control,
	Mensaje m
	WHERE
	control.id_control = m.id_control AND
	control.estado != 'AUTORIZADO'
	ORDER BY
	control.id_control DESC
receipt_massive_state_update = UPDATE
	Control
	SET
	estado = ?
	WHERE
	estado = ?
controlled_resource_by_number_and_resource_type = SELECT id_control
    FROM CONTROL
    WHERE numero_comprobante = ?
    AND tipo_comprobante = ?
    AND company_name = ?
receipt_create_control_table = CREATE TABLE
	Control(
	id_control bigint IDENTITY(1,1) NOT NULL PRIMARY KEY,
	tipo_comprobante int NOT NULL,
	id_local varchar(100) NOT NULL,
	numero_comprobante varchar(20) NOT NULL,
	estado varchar(13),
	numero_autorizacion varchar(100),
	fecha_autorizacion datetime,
	fecha_emision datetime,
	fecha_ingreso datetime,
	fecha_ultimo_envio datetime,
	clave_acceso varchar(50),
	id_externo varchar(40),
	company_name varchar(40),
	CONSTRAINT ix_tipo_idlocal UNIQUE (tipo_comprobante, id_local, numero_comprobante, company_name)
	)
receipt_create_message_table = CREATE TABLE
	Mensaje(
	id_control bigint,
	identificador varchar(2) NOT NULL,
	mensaje TEXT NOT NULL,
	tipo varchar(50) NOT NULL,
	fecha_creacion datetime NOT NULL,
	CONSTRAINT pk_comprobante_identificador PRIMARY KEY (id_control, identificador),
	CONSTRAINT fk_control_id FOREIGN KEY (id_control) REFERENCES Control(id_control)
	)
table_exists = SELECT *
	FROM INFORMATION_SCHEMA.TABLES
	WHERE TABLE_SCHEMA = 'dbo'
	AND  TABLE_NAME = ?