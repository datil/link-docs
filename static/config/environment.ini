[General]
timezone = America/Guayaquil
service_name = Datilink
send_email = yes
send_status = no
sync_resources = no
create_tables = no
issue_receipts_from_database = yes
issue_receipts_from_xml = no
update_control_table = yes
read_receipts = yes
app_dirname = Link
encoding = latin-1

[DatabaseSource]
driver = SQL Server
server = localhost
name = erpTest2
user = userTest2
password = userTest2
version = 2014
api = odbc
data_source = None
provider = None
datetime_format = %Y-%m-%d %H:%M:%S

[Log]
level = DEBUG
when = H
interval = 12
backup_count = 5

[Sync]
enabled = no
update_tables = yes
download_files = yes
formats_to_download = printable_version, electronic_document
file_name_encoding = utf-8


[EventTypeCodes]
invoice.received = 1
credit-note.received = 4
debit-note.received = 5
withholding.received = 7
waybill.received = 6
ats-retention.received = 7

[EventResourceStates]
processing = SINCRONIZANDO
success = SINCRONIZADO
failure = ERROR SINCRONIZANDO

[Scheduler]
issue_receipts_interval = 15
read_receipts_interval = 32
issue_receipts_from_xml_interval = 10
send_status_interval = 1
sync_resources_interval = 12

[Constraints]
issue_limit = 8
issue_order = asc
get_info_limit = 10
get_info_order = desc
first_receipt_date = 2016-11-21 00:00:00
max_days_to_query = 30
new_receipts_limit = 8

[Api]
timeout = 35.0
max_attemps = 5
host = https://link.datil.co
status_url = http://192.168.100.103:8080/status
commands_url = http://192.168.100.103:8080/commands
sri_auth_url = https://app.datil.co/api/autorizacionsri
sync_url = https://api.datil.co/link-app/events
ack_url = https://api.datil.co/link-app/events/ack

[ApiPaths]
invoice_issue_from_database = /invoices/issue
invoice_issue_from_xml = /invoices/issue/xml
invoice_reissue = /invoices/:id/reissue
invoice_reissue_xml = /invoices/:id/reissue/xml
invoice_info = /invoices/:id
credit_note_issue_from_database = /credit-notes/issue
credit_note_issue_from_xml = /credit-notes/issue/xml
credit_note_reissue = /credit-notes/:id/reissue
credit_note_reissue_xml = /credit-notes/:id/reissue/xml
credit_note_info = /credit-notes/:id
waybill_issue_from_database = /waybills/issue
waybill_issue_from_xml = /waybills/issue/xml
waybill_reissue = /waybills/:id/reissue
waybill_reissue_xml = /waybills/:id/reissue/xml
waybill_info = /waybills/:id
retention_issue_from_database = /retentions/issue
retention_issue_from_xml = /retentions/issue/xml
retention_reissue = /retentions/:id/reissue
retention_reissue_xml = /retentions/:id/reissue/xml
retention_info = /retentions/:id
debit_note_issue_from_database = /debit-notes/issue
debit_note_issue_from_xml = /debit-notes/issue/xml
debit_note_reissue = /debit-notes/:id/reissue
debit_note_reissue_xml = /debit-notes/:id/reissue/xml
debit_note_info = /debit-notes/:id
purchase_settlement_issue_from_database = /purchase-settlements/issue
purchase_settlement_issue_from_xml = /purchase-settlements/issue/xml
purchase_settlement_reissue = /purchase-settlements/:id/reissue
purchase_settlement_reissue_xml = /purchase-settlements/:id/reissue/xml
purchase_settlement_info = /purchase-settlements/:id
ats_retention_issue_from_database = /ats-retentions/issue
ats_retention_issue_from_xml = /ats-retentions/issue/xml
ats_retention_reissue = /ats-retentions/:id/reissue
ats_retention_reissue_xml = /ats-retentions/:id/reissue/xml
ats_retention_info = /ats-retentions/:id

[Notification]
dest_email = ayuda@datil.com
sender_email = link-app@datilmedia.com
email_api_key =
[Gui]
update_panel_interval = 10

[States]
list = POR AUTORIZAR,RECIBIDO,ENVIADO,ERROR CREANDO,DEVUELTO,AUTORIZADO,NO AUTORIZADO,DUPLICADO,LEIDO

[Errors]
solve_with_issue = Error 500,Connection refused,interbloqueo,gaierror,ConnectTimeoutError,Connection aborted,Read timed out, CERTIFICATE_VERIFY_FAILED
solve_with_reading = No es posible modificar un comprobante autorizado,CLAVE DE ACCESO EN PROCESAMIENTO
solve_with_reading_if_issued = CERTIFICATE_VERIFY_FAILED
solve_with_sri_authorize = El comprobante no tiene un estado que permite modificarlo
solve_with_set_duplicated = Ya existe un
database_soft_errors = Tiempo de espera agotado para el tipo de pestillo,The login failed,Error general de red,Error de inicio de sesi,Cannot open database,SHUTDOWN en curso,No se puede abrir la base de datos
database_soft_errors_threshold = 4
throttle_time_seconds = 120